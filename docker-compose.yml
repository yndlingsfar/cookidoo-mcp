# Startet den Cookidoo-MCP hinter dem bestehenden Cloudflare-Tunnel.
# Bau: aus dem Dockerfile hier. Start: `docker compose up -d --build`.
services:
  cookidoo-mcp:
    build: .
    image: cookidoo-mcp:latest
    container_name: cookidoo-mcp
    env_file: .env
    volumes:
      # auth_store.json + optionale .cookidoo-session.json überleben die Kiste.
      # Verzeichnis mounten, nie die Datei (atomarer rename!).
      - ~/cookidoo-mcp-data:/data
    restart: unless-stopped
    networks:
      - proxy
    # Von außen kommt der Traffic durch den Cloudflare-Tunnel. Im LAN schreibt
    # der Resolver *.ohana-five.dev aber auf diesen Host um, und dort antwortet
    # Traefik — ohne Router also 404, u.a. auf der OAuth-Seite /authorize, die
    # der Browser öffnen muss. Derselbe Hostname, damit MCP_PUBLIC_URL passt.
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.cookidoo-mcp.entrypoints: "https"
      traefik.http.routers.cookidoo-mcp.rule: "Host(`cookidoo.ohana-five.dev`)"
      traefik.http.routers.cookidoo-mcp.tls: "true"
      traefik.http.services.cookidoo-mcp.loadbalancer.server.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

# Bestehendes externes Netz (Traefik/cloudflared hängen dran) — nur beitreten.
networks:
  proxy:
    external: true
